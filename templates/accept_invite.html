<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>เปิดใช้งานบัญชี Admin — Luma Skin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-md p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Luma Skin</h1>
      <p class="text-sm text-slate-500 mt-1">ตั้งรหัสผ่านเพื่อเปิดใช้งานบัญชีผู้ดูแลระบบ</p>
    </div>

    <div class="bg-indigo-50 border border-indigo-100 rounded-lg p-3 mb-4 text-xs text-indigo-800">
      บัญชี: <strong>{{ invited_user.email }}</strong> ({{ invited_user.role }})
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/accept-invite" class="space-y-4">
      <input type="hidden" name="token" value="{{ token }}" />
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">กำหนดรหัสผ่านใหม่ (ขั้นต่ำ 6 ตัวอักษร)</label>
        <input type="password" name="password" required minlength="6"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">ยืนยันรหัสผ่านอีกครั้ง</label>
        <input type="password" name="confirm_password" required minlength="6"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition">
        ยืนยันและเปิดใช้งานบัญชี
      </button>
    </form>
  </div>
</body>
</html>
