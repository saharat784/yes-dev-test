<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Luma Skin Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white w-full max-w-md rounded-2xl shadow-md p-8">
    <div class="text-center mb-6">
      <h1 class="text-2xl font-bold text-slate-800">Luma Skin</h1>
      <p class="text-sm text-slate-500 mt-1">ระบบจัดการสินค้าและ QR Code ภายใน</p>
    </div>

    {% if error %}
    <div class="bg-red-50 border border-red-200 text-red-700 text-sm rounded-lg p-3 mb-4">
      {{ error }}
    </div>
    {% endif %}

    <form method="POST" action="/login" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">อีเมล</label>
        <input type="email" name="email" required placeholder="superadmin@lumaskin.com"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">รหัสผ่าน</label>
        <input type="password" name="password" required placeholder="••••••••"
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition">
        เข้าสู่ระบบ
      </button>
    </form>

    <div class="mt-6 pt-4 border-t border-slate-100 text-xs text-slate-400 space-y-1">
      <p><strong>Super Admin:</strong> superadmin@lumaskin.com / Admin1234!</p>
      <p><strong>Admin:</strong> admin@lumaskin.com / Admin1234!</p>
    </div>
  </div>
</body>
</html>
